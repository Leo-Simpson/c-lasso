# Workflow: Test
#
# Lints once, then runs the test suite on every supported Python version.
# Lint rules, pytest options and the coverage `fail_under` all live in pyproject.toml.
#
# Third-party actions are pinned to commit SHAs (version in the trailing comment);
# bump them together with the comment.

name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded in-progress runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff==0.17.1

      # Rules come from [tool.ruff.lint] in pyproject.toml.
      - name: Lint with ruff
        run: ruff check --output-format=github .

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # versioneer derives the version from git tags

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: python -m pip install ".[tests]"

      - name: Test with pytest (coverage gate from pyproject.toml)
        env:
          MPLBACKEND: Agg
        run: python -m pytest --cov --cov-report=term-missing
